
<style>
  :root {
    --bg: #0A1628;
    --surface: #111F35;
    --surface2: #152338;
    --sk-base: #1A2D47;
    --sk-shine: #213556;
    --gold: #F5C842;
    --radius: 12px;
    --radius-sm: 8px;
    --radius-pill: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .wrapper {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-lg);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .screen-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--color-text-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .phone {
    background: var(--bg);
    border-radius: 28px;
    border: 2px solid #1E3050;
    overflow: hidden;
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
    position: relative;
  }

  .phone-inner {
    padding: 14px 14px 0;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .notch {
    width: 80px;
    height: 6px;
    background: #1E3050;
    border-radius: 3px;
    margin: 0 auto 10px;
  }

  @keyframes shimmer {
    0% { background-position: -300px 0; }
    100% { background-position: 300px 0; }
  }

  .sk {
    background: linear-gradient(90deg, var(--sk-base) 25%, var(--sk-shine) 50%, var(--sk-base) 75%);
    background-size: 600px 100%;
    animation: shimmer 1.6s infinite;
    border-radius: var(--radius-sm);
  }

  .sk-pill { border-radius: var(--radius-pill); }
  .sk-circle { border-radius: 50%; }

  .sk-h8 { height: 8px; }
  .sk-h10 { height: 10px; }
  .sk-h12 { height: 12px; }
  .sk-h14 { height: 14px; }
  .sk-h16 { height: 16px; }
  .sk-h20 { height: 20px; }
  .sk-h24 { height: 24px; }
  .sk-h32 { height: 32px; }
  .sk-h40 { height: 40px; }
  .sk-h48 { height: 48px; }
  .sk-h60 { height: 60px; }
  .sk-h80 { height: 80px; }
  .sk-h100 { height: 100px; }
  .sk-h120 { height: 120px; }

  .sk-w20 { width: 20px; }
  .sk-w30 { width: 30%; }
  .sk-w40 { width: 40%; }
  .sk-w50 { width: 50%; }
  .sk-w60 { width: 60%; }
  .sk-w70 { width: 70%; }
  .sk-w80 { width: 80%; }
  .sk-w100 { width: 100%; }
  .sk-w32 { width: 32px; }
  .sk-w44 { width: 44px; }
  .sk-w64 { width: 64px; }

  .row { display: flex; align-items: center; gap: 8px; }
  .row-spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .col { display: flex; flex-direction: column; gap: 6px; flex: 1; }

  .card-sk {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-hero {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid #1E3050;
  }

  .chip-row {
    display: flex;
    gap: 8px;
    overflow: hidden;
  }

  .chip-sk {
    height: 32px;
    flex-shrink: 0;
    border-radius: var(--radius-pill);
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

  .action-btn-sk {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .bottom-nav {
    background: var(--surface);
    border-top: 1px solid #1E3050;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 10px 0 14px;
    margin: auto -14px 0;
  }

  .nav-item-sk {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .fab-sk {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #1E3355;
    border: 2px solid #2A4070;
    margin-top: -16px;
  }

  .divider {
    height: 1px;
    background: #1A2D47;
    width: 100%;
  }

  .tab-row {
    display: flex;
    gap: 8px;
    border-bottom: 1px solid #1A2D47;
    padding-bottom: 10px;
  }

  .tab-sk { border-radius: var(--radius-sm); }

  .list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid #1A2D47;
  }
  .list-item:last-child { border-bottom: none; }

  .tag-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
</style>
